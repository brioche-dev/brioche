[package]
name = "brioche-test-support"
version = "0.1.7"
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.101"
assert_matches = "1.5.0"
brioche-core = { path="../brioche-core" }
bstr = "1.12.1"
futures = "0.3.31"
mockito = "1.7.2"
object_store = "0.13.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.24.0"
tokio = { version = "1.49.0", features = ["full", "tracing"] }
toml = "0.9.11"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
ulid = "1.2.1"

[lints]
workspace = true
